<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eq-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7eff00"/>
      <stop offset="33%" stop-color="#00ff88"/>
      <stop offset="66%" stop-color="#00cc88"/>
      <stop offset="100%" stop-color="#1a8844"/>
    </linearGradient>
    <style>
      .bg { fill: #000000; stroke: #1c1c1e; stroke-width: 2px; }
      .hdr { fill: #050505; }
      .font-mono { font-family: 'SF Mono', 'Monaco', 'Courier New', monospace; font-size: 13px; }
      .title { fill: #666; font-size: 12px; font-weight: 600; font-family: -apple-system, sans-serif; letter-spacing: 0.8px; }
      
      .green { fill: #ff006e; font-weight: 600; }
      .cyan { fill: #8338ec; font-weight: 600; }
      .white { fill: #ffffff; }
      .gray { fill: #666666; font-size: 11px; }
      
      /* Анимация прыгающих полосок эквалайзера */
      .eq-bar { fill: url(#eq-grad); rx: 3px; filter: drop-shadow(0 0 8px rgba(126, 255, 0, 0.6)); }
      .eq1 { animation: eqAnim 1.2s infinite ease-in-out; }
      .eq2 { animation: eqAnim 0.8s infinite ease-in-out 0.2s; }
      .eq3 { animation: eqAnim 1.5s infinite ease-in-out 0.4s; }
      .eq4 { animation: eqAnim 0.9s infinite ease-in-out 0.1s; }
      .eq5 { animation: eqAnim 1.3s infinite ease-in-out 0.5s; }
      .eq6 { animation: eqAnim 1.0s infinite ease-in-out 0.3s; }
      
      @keyframes eqAnim {
        0%, 100% { height: 8px; y: 430px; }
        50% { height: 48px; y: 390px; }
      }
    </style>
  </defs>

  <!-- Окно 500x500 -->
  <rect width="100%" height="100%" rx="14" class="bg"/>
  <path d="M 1 12 Q 1 1 12 1 L 488 1 Q 499 1 499 12 L 499 35 L 1 35 Z" class="hdr"/>
  <line x1="1" y1="35" x2="499" y2="35" stroke="#151515" stroke-width="1.5"/>

  <!-- Кнопки macOS -->
  <circle cx="25" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="43" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="61" cy="18" r="5" fill="#27c93f"/>
  <text x="250" y="22" text-anchor="middle" class="title">music // now playing</text>

  <g class="font-mono">
    <!-- Бейдж статуса -->
    <g transform="translate(45, 75)">
      <text x="0" y="0" font-size="11" fill="#ff006e" font-weight="bold">> AUDIO_STREAM: ACTIVE </text>
      <text x="410" y="0" text-anchor="end" font-size="11" fill="#666666">FLAC // LOSSLESS</text>
      <line x1="0" y1="15" x2="410" y2="15" stroke="#1c1c1e" stroke-width="1.5"/>
    </g>

    <!-- Главный хит Дрейка (Крупный чистый текст) -->
    <text x="250" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">God's Plan</text>
    <text x="250" y="175" text-anchor="middle" font-size="14" fill="#8338ec">Drake — Scorpion</text>
    <text x="250" y="198" text-anchor="middle" font-size="11" fill="#666666">OVO Sound // Republic Records</text>

    <!-- Таймлайн трека (01:42 из 03:18) -->
    <g transform="translate(45, 240)">
      <text x="0" y="10" class="gray">01:42</text>
      <rect x="45" y="4" width="320" height="6" rx="3" fill="#1c1c1e"/>
      <rect x="45" y="4" width="168" height="6" rx="3" fill="#8338ec"/>
      <circle cx="213" cy="7" r="6" fill="#ffffff" stroke="#8338ec" stroke-width="2"/>
      <text x="410" y="10" text-anchor="end" class="gray">03:18</text>
    </g>

    <!-- Кнопки управления плеером -->
    <g transform="translate(250, 310)" text-anchor="middle" font-size="18" fill="#ffffff">
      <text x="-100" y="6" fill="#666666" font-size="14"></text>
      <text x="-50" y="6">⏮</text>
      <!-- Центральная кнопка Pause -->
      <circle cx="0" cy="0" r="22" fill="#1c1c1e" stroke="#333333" stroke-width="1.5"/>
      <text x="0" y="6" font-size="16">⏸</text>
      <text x="50" y="6">⏭</text>
      <text x="100" y="6" fill="#ff006e" font-size="14"></text>
    </g>

    <!-- Анимированный прыгающий эквалайзер (22 широкие звуковые полосы) - сдвинут вправо, зелёный градиент -->
    <g>
      <rect x="80" width="10" height="15" y="423" class="eq-bar eq1"/>
      <rect x="97" width="10" height="25" y="413" class="eq-bar eq2"/>
      <rect x="114" width="10" height="10" y="428" class="eq-bar eq3"/>
      <rect x="131" width="10" height="35" y="403" class="eq-bar eq4"/>
      <rect x="148" width="10" height="18" y="420" class="eq-bar eq5"/>
      <rect x="165" width="10" height="30" y="408" class="eq-bar eq6"/>
      <rect x="182" width="10" height="12" y="426" class="eq-bar eq1"/>
      <rect x="199" width="10" height="42" y="396" class="eq-bar eq3"/>
      
      <rect x="216" width="10" height="22" y="416" class="eq-bar eq2"/>
      <rect x="233" width="10" height="46" y="392" class="eq-bar eq4"/>
      <rect x="250" width="10" height="16" y="422" class="eq-bar eq6"/>
      <rect x="267" width="10" height="38" y="400" class="eq-bar eq1"/>
      <rect x="284" width="10" height="24" y="414" class="eq-bar eq5"/>
      <rect x="301" width="10" height="44" y="394" class="eq-bar eq3"/>
      <rect x="318" width="10" height="14" y="424" class="eq-bar eq2"/>
      <rect x="335" width="10" height="34" y="404" class="eq-bar eq4"/>
      
      <rect x="352" width="10" height="20" y="418" class="eq-bar eq6"/>
      <rect x="369" width="10" height="40" y="398" class="eq-bar eq1"/>
      <rect x="386" width="10" height="12" y="426" class="eq-bar eq5"/>
      <rect x="403" width="10" height="28" y="410" class="eq-bar eq2"/>
    </g>
  </g>
</svg>