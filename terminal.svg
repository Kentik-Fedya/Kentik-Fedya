<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" width="100%" height="100%">
  <!-- ОБОЛОЧКА И КНОПКИ MACOS -->
  <rect width="100%" height="100%" rx="12" fill="#000000" stroke="#1c1c1e" stroke-width="2"/>
  <path d="M 1 12 Q 1 1 12 1 L 738 1 Q 749 1 749 12 L 749 35 L 1 35 Z" fill="#050505"/>
  <line x1="1" y1="35" x2="749" y2="35" stroke="#151515" stroke-width="1.5"/>

  <circle cx="28" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="48" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="5.5" fill="#27c93f"/>
  <text x="375" y="22" text-anchor="middle" fill="#666666" font-size="12" font-weight="bold" font-family="-apple-system, sans-serif" letter-spacing="0.5">zsh</text>

  <!-- КОНТЕНТ ТЕРМИНАЛА -->
  <g font-family="Monaco, SF Mono, Courier New, monospace" font-size="14" transform="translate(30, 80)">
    
    <!-- 1. whoami -->
    <text y="0"><tspan fill="#4cd964" font-weight="bold">bug-dealer</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#34aadc" font-weight="bold">~</tspan><tspan fill="#ffffff"> % </tspan><tspan fill="#ffffff">whoami</tspan></text>
    <rect x="135" y="-12" width="200" height="15" fill="#000000">
      <animate attributeName="x" from="135" to="300" dur="0.8s" begin="0.5s" fill="freeze" />
    </rect>
    <text y="25" fill="#ffffff" opacity="0">Kentik-Fedya<animate attributeName="opacity" to="1" dur="0.1s" begin="1.5s" fill="freeze" /></text>

    <!-- 2. status -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.1s" begin="2.0s" fill="freeze" />
      <text y="65"><tspan fill="#4cd964" font-weight="bold">bug-dealer</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#34aadc" font-weight="bold">~</tspan><tspan fill="#ffffff"> % cat current_status.log</tspan></text>
      <rect x="135" y="53" width="300" height="15" fill="#000000">
        <animate attributeName="x" from="135" to="400" dur="1.2s" begin="2.2s" fill="freeze" />
      </rect>
      <text y="90" fill="#ffffff" font-family="sans-serif" opacity="0">Building projects &amp; catching bugs &#128187; &#128640;<animate attributeName="opacity" to="1" dur="0.1s" begin="3.8s" fill="freeze" /></text>
    </g>

    <!-- 3. skills -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.1s" begin="4.8s" fill="freeze" />
      <text y="130"><tspan fill="#4cd964" font-weight="bold">bug-dealer</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#34aadc" font-weight="bold">~</tspan><tspan fill="#ffffff"> % ./load_skills.sh</tspan></text>
      <rect x="135" y="118" width="200" height="15" fill="#000000">
        <animate attributeName="x" from="135" to="350" dur="0.8s" begin="5.0s" fill="freeze" />
      </rect>
      
      <g opacity="0">
        <animate attributeName="opacity" to="1" dur="0.1s" begin="6.2s" fill="freeze" />
        
        <text y="160" fill="#ffffff">Python</text>
        <rect x="130" y="150" width="180" height="8" rx="4" fill="#111111"/>
        <rect x="130" y="150" width="0" height="8" rx="4" fill="#f1e05a">
          <animate attributeName="width" from="0" to="150" dur="1s" begin="6.3s" fill="freeze" />
        </rect>

        <text y="180" fill="#ffffff">HTML</text>
        <rect x="130" y="170" width="180" height="8" rx="4" fill="#111111"/>
        <rect x="130" y="170" width="0" height="8" rx="4" fill="#58a6ff">
          <animate attributeName="width" from="0" to="120" dur="1s" begin="6.4s" fill="freeze" />
        </rect>

        <text y="200" fill="#ffffff">C++ (learning)</text>
        <rect x="130" y="190" width="180" height="8" rx="4" fill="#111111"/>
        <rect x="130" y="190" width="0" height="8" rx="4" fill="#3fb950">
          <animate attributeName="width" from="0" to="50" dur="1s" begin="6.5s" fill="freeze" />
        </rect>

        <text x="350" y="160" fill="#ffffff">Ps &amp; DaVinci</text>
        <rect x="460" y="150" width="180" height="8" rx="4" fill="#111111"/>
        <rect x="460" y="150" width="0" height="8" rx="4" fill="#1f6feb">
          <animate attributeName="width" from="0" to="140" dur="1s" begin="6.6s" fill="freeze" />
        </rect>
      </g>
    </g>

    <!-- 4. hobbies -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.1s" begin="8.2s" fill="freeze" />
      <text y="240"><tspan fill="#4cd964" font-weight="bold">bug-dealer</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#34aadc" font-weight="bold">~</tspan><tspan fill="#ffffff"> % echo $HOBBIES</tspan></text>
      <rect x="135" y="228" width="200" height="15" fill="#000000">
        <animate attributeName="x" from="135" to="350" dur="0.8s" begin="8.5s" fill="freeze" />
      </rect>
      <text y="265" fill="#79c0ff" font-weight="bold" opacity="0">Gaming <tspan fill="#ffffff" font-weight="normal">|</tspan> Music <tspan fill="#ffffff" font-weight="normal">|</tspan> Coding <tspan fill="#ffffff" font-weight="normal">|</tspan> Chilling
        <animate attributeName="opacity" to="1" dur="0.1s" begin="9.5s" fill="freeze" />
      </text>
    </g>

    <!-- 5. cursor -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.1s" begin="10.2s" fill="freeze" />
      <text y="305"><tspan fill="#4cd964" font-weight="bold">bug-dealer</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#34aadc" font-weight="bold">~</tspan><tspan fill="#ffffff"> % </tspan></text>
      <text x="132" y="305" fill="#ffffff" font-weight="bold">|
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="10.2s" />
      </text>
    </g>
  </g>
</svg>
