<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 446" width="100%" height="100%" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <!-- Главный диагональный градиент фона (1 в 1 как на аватарке) -->
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050b"/>
      <stop offset="42%" stop-color="#08162b"/>
      <stop offset="78%" stop-color="#112d55"/>
      <stop offset="100%" stop-color="#1b4982"/>
    </linearGradient>

    <!-- Мягкое сапфировое свечение в правом нижнем углу -->
    <radialGradient id="corner-glow" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#2864b2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#02050b" stop-opacity="0"/>
    </radialGradient>

    <!-- Градиентная рамка терминала -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2d45"/>
      <stop offset="50%" stop-color="#284975"/>
      <stop offset="100%" stop-color="#3a6ea8"/>
    </linearGradient>

    <!-- Градиент для шапки окна -->
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02050a"/>
      <stop offset="100%" stop-color="#09182e"/>
    </linearGradient>

    <!-- Ледяной голубой градиент для промпта bug-dealer -->
    <linearGradient id="prompt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#b6e2ff"/>
    </linearGradient>

    <!-- Эстетичные градиенты для полосок скиллов в палитре аватарки -->
    <linearGradient id="bar-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e4db7"/>
      <stop offset="55%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#e0f4ff"/>
    </linearGradient>

    <linearGradient id="bar-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#163888"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="bar-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b4498"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#d8f0ff"/>
    </linearGradient>

    <linearGradient id="bar-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Компактный и аккуратный символ % -->
    <g id="pct">
      <ellipse cx="3.0" cy="-8.2" rx="1.75" ry="2.15" fill="none" stroke="#eef6ff" stroke-width="1.25"/>
      <line x1="2.4" y1="-1.0" x2="8.6" y2="-10.4" stroke="#eef6ff" stroke-width="1.25" stroke-linecap="round"/>
      <ellipse cx="8.0" cy="-3.2" rx="1.75" ry="2.15" fill="none" stroke="#eef6ff" stroke-width="1.25"/>
    </g>

    <!-- Готовый шаблон промпта bug-dealer:~ % -->
    <g id="shell-prompt">
      <text x="54" y="0" class="prompt">
        <tspan class="prompt-color">bug-dealer:</tspan><tspan class="tilde-blue">~</tspan>
      </text>
      <use href="#pct" x="172" y="0"/>
    </g>

    <!-- Жесткая обрезка по контуру окна -->
    <clipPath id="window-clip">
      <rect x="16" y="12" width="808" height="422" rx="12"/>
    </clipPath>

    <!-- Посимвольные маски с человеческим ритмом набора -->
    <!-- 1. whoami (6 символов) -->
    <clipPath id="type-cmd1">
      <rect x="192" y="65" width="0" height="28">
        <animate attributeName="width"
          values="0;10;19;29;39;48;58"
          keyTimes="0;0.14;0.27;0.46;0.62;0.81;1"
          begin="0.45s" dur="0.55s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- 2. cat current_status.log (22 символа) -->
    <clipPath id="type-cmd2">
      <rect x="192" y="132" width="0" height="28">
        <animate attributeName="width"
          values="0;10;19;29;38;48;58;67;77;86;96;106;115;125;134;144;154;163;173;182;192;202;212"
          keyTimes="0;0.03;0.06;0.09;0.17;0.21;0.24;0.27;0.30;0.34;0.37;0.41;0.49;0.53;0.57;0.60;0.64;0.68;0.72;0.81;0.87;0.93;1"
          begin="1.65s" dur="1.35s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- 3. ./load_skills.sh (16 символов) -->
    <clipPath id="type-cmd3">
      <rect x="192" y="199" width="0" height="28">
        <animate attributeName="width"
          values="0;10;19;29;38;48;58;67;77;86;96;106;115;125;134;144;154"
          keyTimes="0;0.05;0.15;0.20;0.25;0.29;0.34;0.44;0.49;0.54;0.59;0.63;0.68;0.73;0.83;0.91;1"
          begin="3.65s" dur="1.05s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- 4. echo $HOBBIES (13 символов) -->
    <clipPath id="type-cmd4">
      <rect x="192" y="321" width="0" height="28">
        <animate attributeName="width"
          values="0;10;19;29;38;48;58;67;77;86;96;106;115;125"
          keyTimes="0;0.05;0.10;0.15;0.20;0.31;0.43;0.51;0.58;0.66;0.74;0.82;0.91;1"
          begin="6.35s" dur="0.9s" calcMode="discrete" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono {
      font-family: 'Monaco', 'Roboto Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0px;
    }
    .prompt {
      font-family: 'Monaco', 'Roboto Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0px;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 400;
    }
    .title {
      font-family: 'Monaco', 'Roboto Mono', monospace;
      font-size: 13px;
      fill: #6a88ad;
      font-weight: 500;
    }

    .prompt-color { fill: url(#prompt-grad); }
    .tilde-blue   { fill: #8cd2ff; }
    .white        { fill: #eef6ff; }
    .hobbies-text { fill: #9ac8ff; }
    .hobbies-sep  { fill: #4978b5; }

    /* Мгновенное появление промптов и ответов как в реальном zsh */
    .p1, .out1, .p2, .out2, .p3, .sk1, .sk2, .sk3, .sk4, .p4, .out4, .p5 {
      opacity: 0;
    }

    .p1   { animation: snapIn 0.01s forwards 0.1s; }
    .out1 { animation: snapIn 0.01s forwards 1.25s; }

    .p2   { animation: snapIn 0.01s forwards 1.3s; }
    .out2 { animation: snapIn 0.01s forwards 3.25s; }

    .p3   { animation: snapIn 0.01s forwards 3.3s; }
    /* Каскадная подгрузка строк скрипта ./load_skills.sh */
    .sk1  { animation: snapIn 0.08s forwards 4.95s; }
    .sk2  { animation: snapIn 0.08s forwards 5.1s; }
    .sk3  { animation: snapIn 0.08s forwards 5.25s; }
    .sk4  { animation: snapIn 0.08s forwards 5.4s; }

    .p4   { animation: snapIn 0.01s forwards 6.0s; }
    .out4 { animation: snapIn 0.01s forwards 7.5s; }

    .p5   { animation: snapIn 0.01s forwards 7.55s; }

    .cursor-blink {
      animation: blink 1s step-end infinite;
      animation-delay: 7.55s;
    }

    @keyframes snapIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Равномерный, идеально симметричный 6-слойный рассеивающийся контур (со всех 4 сторон) -->
  <rect x="6"    y="2"    width="828"   height="442"   rx="21"   fill="#020814" opacity="0.03"/>
  <rect x="8"    y="4"    width="824"   height="438"   rx="19"   fill="#020814" opacity="0.06"/>
  <rect x="10"   y="6"    width="820"   height="434"   rx="17"   fill="#020814" opacity="0.10"/>
  <rect x="12"   y="8"    width="816"   height="430"   rx="15"   fill="#020814" opacity="0.16"/>
  <rect x="14"   y="10"   width="812"   height="426"   rx="13.5" fill="#020814" opacity="0.24"/>
  <rect x="15.2" y="11.2" width="809.6" height="423.6" rx="12.6" fill="#020814" opacity="0.34"/>

  <!-- Основной корпус терминала с градиентом аватарки -->
  <rect x="16" y="12" width="808" height="422" rx="12" fill="url(#avatar-bg)"/>
  <rect x="16" y="12" width="808" height="422" rx="12" fill="url(#corner-glow)"/>

  <!-- Все внутренние элементы строго внутри контура окна -->
  <g clip-path="url(#window-clip)">
    <!-- Верхняя шапка окна -->
    <rect x="16" y="12" width="808" height="33" fill="url(#header-bg)"/>
    <line x1="16" y1="45" x2="824" y2="45" stroke="#182e4d" stroke-width="1"/>

    <!-- Кнопки светофора -->
    <circle cx="43" cy="28.5" r="5.8" fill="#ff5f56"/>
    <circle cx="63" cy="28.5" r="5.8" fill="#ffbd2e"/>
    <circle cx="83" cy="28.5" r="5.8" fill="#27c93f"/>

    <!-- Заголовок zsh -->
    <text x="420" y="33" text-anchor="middle" class="title">zsh</text>

    <!-- ================= 1. whoami ================= -->
    <g class="p1">
      <use href="#shell-prompt" x="0" y="85"/>
    </g>
    <g clip-path="url(#type-cmd1)">
      <text x="192" y="85" class="mono white">whoami</text>
    </g>
    <rect x="192" y="71" width="2.2" height="16" fill="#b6e2ff" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;1" begin="0.1s" dur="1.15s" calcMode="discrete" fill="freeze"/>
      <animate attributeName="x"
        values="192;202;211;221;231;240;250"
        keyTimes="0;0.14;0.27;0.46;0.62;0.81;1"
        begin="0.45s" dur="0.55s" calcMode="discrete" fill="freeze"/>
    </rect>
    <g class="out1">
      <text x="54" y="113" class="mono white">Kentik-Fedya</text>
    </g>

    <!-- ================= 2. current_status.log ================= -->
    <g class="p2">
      <use href="#shell-prompt" x="0" y="152"/>
    </g>
    <g clip-path="url(#type-cmd2)">
      <text x="192" y="152" class="mono white">cat current_status.log</text>
    </g>
    <rect x="192" y="138" width="2.2" height="16" fill="#b6e2ff" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;1" begin="1.3s" dur="1.95s" calcMode="discrete" fill="freeze"/>
      <animate attributeName="x"
        values="192;202;211;221;230;240;250;259;269;278;288;298;307;317;326;336;346;355;365;374;384;394;404"
        keyTimes="0;0.03;0.06;0.09;0.17;0.21;0.24;0.27;0.30;0.34;0.37;0.41;0.49;0.53;0.57;0.60;0.64;0.68;0.72;0.81;0.87;0.93;1"
        begin="1.65s" dur="1.35s" calcMode="discrete" fill="freeze"/>
    </rect>
    <g class="out2">
      <text x="54" y="180" class="sans white">Building projects &amp; catching bugs &#128187; &#128640;</text>
    </g>

    <!-- ================= 3. ./load_skills.sh ================= -->
    <g class="p3">
      <use href="#shell-prompt" x="0" y="219"/>
    </g>
    <g clip-path="url(#type-cmd3)">
      <text x="192" y="219" class="mono white">./load_skills.sh</text>
    </g>
    <rect x="192" y="205" width="2.2" height="16" fill="#b6e2ff" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;1" begin="3.3s" dur="1.65s" calcMode="discrete" fill="freeze"/>
      <animate attributeName="x"
        values="192;202;211;221;230;240;250;259;269;278;288;298;307;317;326;336;346"
        keyTimes="0;0.05;0.15;0.20;0.25;0.29;0.34;0.44;0.49;0.54;0.59;0.63;0.68;0.73;0.83;0.91;1"
        begin="3.65s" dur="1.05s" calcMode="discrete" fill="freeze"/>
    </rect>

    <!-- Каскадная подгрузка скиллов -->
    <g class="sk1">
      <text x="54" y="250" class="mono white">Python</text>
      <rect x="196" y="239" width="192" height="10" rx="5" fill="#061223" stroke="#1b375d" stroke-width="0.9"/>
      <rect x="196" y="239" width="0" height="10" rx="5" fill="url(#bar-1)">
        <animate attributeName="width" from="0" to="160" begin="5.0s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </g>

    <g class="sk2">
      <text x="438" y="250" class="mono white">Ps &amp; DaVinci</text>
      <rect x="570" y="239" width="192" height="10" rx="5" fill="#061223" stroke="#1b375d" stroke-width="0.9"/>
      <rect x="570" y="239" width="0" height="10" rx="5" fill="url(#bar-2)">
        <animate attributeName="width" from="0" to="150" begin="5.15s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </g>

    <g class="sk3">
      <text x="54" y="276" class="mono white">Algorithm</text>
      <rect x="196" y="265" width="192" height="10" rx="5" fill="#061223" stroke="#1b375d" stroke-width="0.9"/>
      <rect x="196" y="265" width="0" height="10" rx="5" fill="url(#bar-3)">
        <animate attributeName="width" from="0" to="128" begin="5.3s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </g>

    <g class="sk4">
      <text x="54" y="302" class="mono white">C++ (learning)</text>
      <rect x="196" y="291" width="192" height="10" rx="5" fill="#061223" stroke="#1b375d" stroke-width="0.9"/>
      <rect x="196" y="291" width="0" height="10" rx="5" fill="url(#bar-4)">
        <animate attributeName="width" from="0" to="54" begin="5.45s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </g>

    <!-- ================= 4. echo $HOBBIES ================= -->
    <g class="p4">
      <use href="#shell-prompt" x="0" y="341"/>
    </g>
    <g clip-path="url(#type-cmd4)">
      <text x="192" y="341" class="mono white">echo $HOBBIES</text>
    </g>
    <rect x="192" y="327" width="2.2" height="16" fill="#b6e2ff" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;1" begin="6.0s" dur="1.5s" calcMode="discrete" fill="freeze"/>
      <animate attributeName="x"
        values="192;202;211;221;230;240;250;259;269;278;288;298;307;317"
        keyTimes="0;0.05;0.10;0.15;0.20;0.31;0.43;0.51;0.58;0.66;0.74;0.82;0.91;1"
        begin="6.35s" dur="0.9s" calcMode="discrete" fill="freeze"/>
    </rect>
    <g class="out4">
      <text x="54" y="369" class="mono">
        <tspan class="hobbies-text">Gaming </tspan><tspan class="hobbies-sep">|</tspan><tspan class="hobbies-text"> Music </tspan><tspan class="hobbies-sep">|</tspan><tspan class="hobbies-text"> Coding </tspan><tspan class="hobbies-sep">|</tspan><tspan class="hobbies-text"> Chilling</tspan>
      </text>
    </g>

    <!-- ================= 5. Финальная строка с мигающим курсором ================= -->
    <g class="p5">
      <use href="#shell-prompt" x="0" y="404"/>
      <rect x="192" y="390" width="2.2" height="16" fill="#b6e2ff" class="cursor-blink"/>
    </g>
  </g>

  <!-- Внешняя градиентная обводка окна -->
  <rect x="16" y="12" width="808" height="422" rx="12" fill="none" stroke="url(#border-grad)" stroke-width="1.3"/>
</svg>
